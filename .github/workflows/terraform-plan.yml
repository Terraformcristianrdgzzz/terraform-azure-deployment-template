name: Terraform Plan

on:
  workflow_dispatch:
    inputs:
      run_plan:
        description: "Create a VM plan (requires ADMIN_SSH_PUBLIC_KEY)"
        required: true
        type: boolean
        default: false

permissions:
  contents: read

jobs:
  plan:
    runs-on: ubuntu-latest
    environment: stage
    permissions:
      contents: read
      id-token: write
    env:
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      ARM_USE_OIDC: "true"
      ARM_USE_AZUREAD: "true"
      TF_IN_AUTOMATION: "true"
      TF_STATE_RESOURCE_GROUP: ${{ vars.TF_STATE_RESOURCE_GROUP }}
      TF_STATE_STORAGE_ACCOUNT: ${{ vars.TF_STATE_STORAGE_ACCOUNT }}
      TF_STATE_CONTAINER: ${{ vars.TF_STATE_CONTAINER }}
      TF_STATE_KEY: ${{ vars.TF_STATE_KEY }}
      TF_VAR_resource_group_name: ${{ vars.AZURE_RESOURCE_GROUP }}
      TF_VAR_location: ${{ vars.AZURE_LOCATION }}
      TF_VAR_vnet_name: ${{ vars.AZURE_VNET_NAME }}
      TF_VAR_vnet_address_space: ${{ vars.AZURE_VNET_ADDRESS_SPACE }}
      TF_VAR_subnet_name: ${{ vars.AZURE_SUBNET_NAME }}
      TF_VAR_subnet_prefixes: ${{ vars.AZURE_SUBNET_PREFIXES }}
      TF_VAR_vm_name: ${{ vars.AZURE_VM_NAME }}
      TF_VAR_admin_username: ${{ vars.AZURE_ADMIN_USERNAME }}
      TF_VAR_admin_ssh_public_key: ${{ vars.ADMIN_SSH_PUBLIC_KEY }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Check state backend configuration
        run: |
          : "${TF_STATE_RESOURCE_GROUP:?Set TF_STATE_RESOURCE_GROUP in the stage environment.}"
          : "${TF_STATE_STORAGE_ACCOUNT:?Set TF_STATE_STORAGE_ACCOUNT in the stage environment.}"
          : "${TF_STATE_CONTAINER:?Set TF_STATE_CONTAINER in the stage environment.}"
          : "${TF_STATE_KEY:?Set TF_STATE_KEY in the stage environment.}"

      - name: Check VM administrator public key
        if: ${{ inputs.run_plan }}
        run: |
          if [ -z "$TF_VAR_admin_ssh_public_key" ]; then
            echo "::error::Set ADMIN_SSH_PUBLIC_KEY in the stage environment to create a VM plan."
            exit 1
          fi

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.16.6

      - name: Check Terraform formatting
        run: terraform fmt -check -recursive

      - name: Initialize Terraform and remote backend
        run: |
          terraform init -input=false \
            -backend-config="resource_group_name=${TF_STATE_RESOURCE_GROUP}" \
            -backend-config="storage_account_name=${TF_STATE_STORAGE_ACCOUNT}" \
            -backend-config="container_name=${TF_STATE_CONTAINER}" \
            -backend-config="key=${TF_STATE_KEY}" \
            -backend-config="use_azuread_auth=true" \
            -backend-config="use_oidc=true"

      - name: Validate Terraform configuration
        run: terraform validate -no-color

      - name: Create Terraform plan
        if: ${{ inputs.run_plan }}
        run: terraform plan -input=false -no-color -out=tfplan
